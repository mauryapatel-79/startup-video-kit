<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"accent","type":"color","label":"Accent","default":"#FF6A3D"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0b0d12;
        --ink: #f4f1ea;
        --accent: #ff6a3d;
        --font-display: "Inter", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; font-family: var(--font-display); }
      #bg { position: absolute; inset: 0; background: radial-gradient(1200px 700px at 70% 20%, #1a1f2b 0%, var(--ground) 70%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="22" data-width="1920" data-height="1080">
      <div id="bg" class="clip" data-start="0" data-duration="22" data-track-index="0"></div>

      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="prompt" data-composition-id="prompt" data-composition-src="compositions/prompt.html" data-start="4" data-duration="4.36" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="pipeline" data-composition-id="pipeline" data-composition-src="compositions/pipeline.html" data-start="8.36" data-duration="5.04" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="formats" data-composition-id="formats" data-composition-src="compositions/formats.html" data-start="13.4" data-duration="2.32" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="15.72" data-duration="6.28" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="22" data-track-index="2" data-track-kind="captions" data-width="1920" data-height="1080"></div>

      <audio id="voice" class="clip" src="assets/voice/narration.wav" data-start="0.2" data-track-index="3" data-volume="1"></audio>
      <audio id="sfx-whoosh-1" class="clip" src="assets/sfx/whoosh.mp3" data-start="3.92" data-duration="0.57" data-track-index="4" data-volume="0.5"></audio>
      <audio id="sfx-type" class="clip" src="assets/sfx/typing.mp3" data-start="6.2" data-duration="1.5" data-track-index="4" data-volume="0.35"></audio>
      <audio id="sfx-whoosh-2" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="8.3" data-duration="0.57" data-track-index="4" data-volume="0.5"></audio>
      <audio id="sfx-pop-1" class="clip" src="assets/sfx/pop.mp3" data-start="9.41" data-duration="0.72" data-track-index="4" data-volume="0.4"></audio>
      <audio id="sfx-pop-2" class="clip" src="assets/sfx/click-soft.mp3" data-start="10.97" data-duration="0.37" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-pop-3" class="clip" src="assets/sfx/pop.mp3" data-start="12.17" data-duration="0.72" data-track-index="4" data-volume="0.4"></audio>
      <audio id="sfx-whoosh-3" class="clip" src="assets/sfx/whoosh.mp3" data-start="13.34" data-duration="0.57" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-impact" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="15.74" data-duration="2.12" data-track-index="4" data-volume="0.6"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
